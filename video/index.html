<!DOCTYPE html>
<html lang="en" data-composition-variables='[]'>
<head>
  <meta charset="UTF-8" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    body {
      margin: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #1e1e1e;
      font-family: Inter, system-ui, sans-serif;
      color: #d4d4d4;
    }
    .scene {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
    }
    /* Scene 0 — Intro */
    #scene0 {
      z-index: 10;
      background: #1e1e1e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
    }
    #scene0 .bg-glow {
      position: absolute;
      width: 800px;
      height: 800px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(139,129,120,0.25) 0%, rgba(139,129,120,0) 70%);
      transform: translate(-50%, -50%);
      left: 50%;
      top: 50%;
    }
    #scene0 .logo-container {
      position: relative;
      display: flex;
      align-items: center;
      gap: 28px;
    }
    #scene0 .logo-icon {
      width: 96px;
      height: 96px;
      border-radius: 20px;
      box-shadow: 0 8px 40px rgba(139,129,120,0.15);
    }
    #scene0 .logo-text {
      font-size: 96px;
      font-weight: 700;
      color: #d4d4d4;
      letter-spacing: -0.03em;
    }
    #scene0 .tagline {
      font-size: 36px;
      font-weight: 400;
      color: #888888;
      letter-spacing: 0.02em;
    }
    #scene0 .grain {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.02;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      background-size: 256px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-width="1920" data-height="1080" data-start="0" data-duration="30">
    <!-- Scene 0: Intro (0s–3s) -->
    <div id="scene0" class="scene">
      <div class="bg-glow"></div>
      <div class="logo-container">
        <img class="logo-icon" src="assets/icon.png" alt="Q" />
        <span class="logo-text">Quietness</span>
      </div>
      <span class="tagline">Leve offline note taking</span>
      <div class="grain"></div>
    </div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    // Scene 0 animations
    tl.from("#scene0 .bg-glow", { opacity: 0, scale: 0.6, duration: 0.8, ease: "power2.out" }, 0.2);
    tl.from("#scene0 .logo-icon", { scale: 0.7, opacity: 0, duration: 0.6, ease: "power3.out" }, 0.4);
    tl.from("#scene0 .logo-text", { y: 60, opacity: 0, duration: 0.6, ease: "power2.out" }, 0.5);
    tl.from("#scene0 .tagline", { y: 30, opacity: 0, duration: 0.5, ease: "power2.out" }, 1.0);

    window.__timelines["main"] = tl;
  </script>
</body>
</html>
