<!DOCTYPE html>
<html lang="en" data-composition-variables='[]'>
<head>
  <meta charset="UTF-8" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    body {
      margin: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #1e1e1e;
      font-family: Inter, system-ui, sans-serif;
      color: #d4d4d4;
    }
    .scene {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
    }
    /* Scene 0 — Intro */
    #scene0 {
      z-index: 10;
      background: #1e1e1e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
    }
    #scene0 .bg-glow {
      position: absolute;
      width: 800px;
      height: 800px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(139,129,120,0.25) 0%, rgba(139,129,120,0) 70%);
      transform: translate(-50%, -50%);
      left: 50%;
      top: 50%;
    }
    #scene0 .logo-container {
      position: relative;
      display: flex;
      align-items: center;
      gap: 28px;
    }
    #scene0 .logo-icon {
      width: 96px;
      height: 96px;
      border-radius: 20px;
      box-shadow: 0 8px 40px rgba(139,129,120,0.15);
    }
    #scene0 .logo-text {
      font-size: 96px;
      font-weight: 700;
      color: #d4d4d4;
      letter-spacing: -0.03em;
    }
    #scene0 .tagline {
      font-size: 36px;
      font-weight: 400;
      color: #888888;
      letter-spacing: 0.02em;
    }
    #scene0 .grain {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.02;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      background-size: 256px;
      pointer-events: none;
    }

    /* Scene 1 — Navigation */
    #scene1 {
      z-index: 9;
      background: #1e1e1e;
      opacity: 0;
    }
    #scene1 .s1-bg-glow {
      position: absolute;
      width: 900px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(139,129,120,0.18) 0%, rgba(139,129,120,0) 70%);
      left: 0;
      top: 0;
      transform: translate(-30%, -20%);
    }
    #scene1 .s1-app-frame {
      position: absolute;
      left: 140px;
      top: 140px;
      right: 140px;
      bottom: 140px;
      display: flex;
      flex-direction: row;
      border: 2px solid #333333;
      border-radius: 12px;
      overflow: hidden;
      background: #1e1e1e;
    }
    #scene1 .s1-sidebar {
      width: 380px;
      background: #252525;
      display: flex;
      flex-direction: column;
      padding: 28px 24px;
      gap: 20px;
      border-right: 2px solid #333333;
    }
    #scene1 .s1-sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #scene1 .s1-app-title {
      font-size: 22px;
      font-weight: 700;
      color: #d4d4d4;
      letter-spacing: -0.02em;
    }
    #scene1 .s1-ctrl-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #8b8178;
      opacity: 0.6;
    }
    #scene1 .s1-search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1e1e1e;
      border: 1.5px solid #333333;
      border-radius: 8px;
      padding: 12px 16px;
    }
    #scene1 .s1-search-icon {
      font-size: 16px;
      opacity: 0.5;
    }
    #scene1 .s1-search-text {
      font-size: 18px;
      color: #666666;
    }
    #scene1 .s1-tree {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    #scene1 .s1-folder,
    #scene1 .s1-subfolder,
    #scene1 .s1-note {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 18px;
    }
    #scene1 .s1-folder {
      color: #d4d4d4;
      font-weight: 600;
    }
    #scene1 .s1-subfolder {
      color: #d4d4d4;
      font-weight: 600;
      padding-left: 34px;
    }
    #scene1 .s1-note {
      color: #888888;
      padding-left: 34px;
    }
    #scene1 .s1-note-active {
      background: #353535;
      color: #d4d4d4;
    }
    #scene1 .s1-note-ext {
      font-size: 15px;
      color: #666666;
    }
    #scene1 .s1-folder-icon,
    #scene1 .s1-subfolder-icon,
    #scene1 .s1-note-icon {
      font-size: 17px;
      width: 20px;
      text-align: center;
    }
    #scene1 .s1-toolbar {
      flex: 1;
      display: flex;
      align-items: flex-start;
      padding: 24px;
      border-bottom: 2px solid #333333;
      position: absolute;
      top: 0;
      left: 380px;
      right: 0;
      height: 60px;
      background: #1e1e1e;
    }
    #scene1 .s1-breadcrumb {
      font-size: 17px;
      white-space: nowrap;
    }
    #scene1 .s1-bc-seg {
      color: #666666;
    }
    #scene1 .s1-bc-sep {
      color: #444444;
      margin: 0 6px;
    }
    #scene1 .s1-bc-current {
      color: #d4d4d4;
      font-weight: 600;
    }
    #scene1 .s1-overlay {
      position: absolute;
      left: 140px;
      bottom: 140px;
      display: flex;
      align-items: center;
      gap: 18px;
    }
    #scene1 .s1-overlay-line {
      width: 40px;
      height: 2px;
      background: #8b8178;
      opacity: 0.7;
    }
    #scene1 .s1-overlay-text {
      font-size: 36px;
      font-weight: 600;
      color: #d4d4d4;
      letter-spacing: -0.02em;
    }
    #scene1 .grain {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.02;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      background-size: 256px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-width="1920" data-height="1080" data-start="0" data-duration="30">
    <!-- Scene 0: Intro (0s–3s) -->
    <div id="scene0" class="scene">
      <div class="bg-glow"></div>
      <div class="logo-container">
        <img class="logo-icon" src="assets/icon.png" alt="Q" />
        <span class="logo-text">Quietness</span>
      </div>
      <span class="tagline">Leve offline note taking</span>
      <div class="grain"></div>
    </div>
    <!-- Scene 1: Navigation (3s–8s) -->
    <div id="scene1" class="scene">
      <div class="s1-bg-glow"></div>
      <!-- App chrome frame -->
      <div class="s1-app-frame">
        <!-- Sidebar -->
        <div class="s1-sidebar">
          <div class="s1-sidebar-header">
            <span class="s1-app-title">Quietness</span>
            <span class="s1-ctrl-dot"></span>
          </div>
          <div class="s1-search-box">
            <span class="s1-search-icon">🔍</span>
            <span class="s1-search-text">Search notes...</span>
          </div>
          <div class="s1-tree">
            <div class="s1-folder">
              <span class="s1-folder-icon">📁</span>
              <span class="s1-folder-name">Journal</span>
            </div>
            <div class="s1-subfolder">
              <span class="s1-subfolder-icon">📁</span>
              <span class="s1-subfolder-name">2026</span>
            </div>
            <div class="s1-note s1-note-active">
              <span class="s1-note-icon">📄</span>
              <span class="s1-note-name">Welcome</span>
              <span class="s1-note-ext">.md</span>
            </div>
            <div class="s1-note">
              <span class="s1-note-icon">📄</span>
              <span class="s1-note-name">Ideas</span>
              <span class="s1-note-ext">.md</span>
            </div>
            <div class="s1-note">
              <span class="s1-note-icon">📄</span>
              <span class="s1-note-name">Tasks</span>
              <span class="s1-note-ext">.md</span>
            </div>
          </div>
        </div>
        <!-- Breadcrumb toolbar -->
        <div class="s1-toolbar">
          <span class="s1-breadcrumb">
            <span class="s1-bc-seg">Journal</span>
            <span class="s1-bc-sep">/</span>
            <span class="s1-bc-seg">2026</span>
            <span class="s1-bc-sep">/</span>
            <span class="s1-bc-current">Welcome.md</span>
          </span>
        </div>
      </div>
      <!-- Overlay text -->
      <div class="s1-overlay">
        <span class="s1-overlay-line"></span>
        <span class="s1-overlay-text">Hierarchical folders &amp; notes</span>
      </div>
      <div class="grain"></div>
    </div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    // Scene 0 animations
    tl.from("#scene0 .bg-glow", { opacity: 0, scale: 0.6, duration: 0.8, ease: "power2.out" }, 0.2);
    tl.from("#scene0 .logo-icon", { scale: 0.7, opacity: 0, duration: 0.6, ease: "power3.out" }, 0.4);
    tl.from("#scene0 .logo-text", { y: 60, opacity: 0, duration: 0.6, ease: "power2.out" }, 0.5);
    tl.from("#scene0 .tagline", { y: 30, opacity: 0, duration: 0.5, ease: "power2.out" }, 1.0);

    // Scene 0 ambient glow breathing
    tl.to("#scene0 .bg-glow", { scale: 1.15, opacity: 1.0, duration: 2, ease: "sine.inOut", yoyo: true, repeat: 1, overwrite: "auto" }, 0.2);

    // Scene 0 → 1 crossfade transition (at 2.5s)
    tl.to("#scene0", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 2.5);
    tl.set("#scene0", { visibility: "hidden" }, 3.0);
    tl.to("#scene1", { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 2.5);

    // Scene 1 ambient glow breathing
    tl.to("#scene1 .s1-bg-glow", { scale: 1.12, opacity: 1.25, duration: 2.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.5);

    // Scene 1 entrance animations
    tl.from("#scene1 .s1-sidebar", { x: -60, opacity: 0, duration: 0.6, ease: "power3.out" }, 3.3);
    tl.from("#scene1 .s1-sidebar-header", { y: -20, opacity: 0, duration: 0.4, ease: "power2.out" }, 3.4);
    tl.from("#scene1 .s1-search-box", { y: -15, opacity: 0, duration: 0.4, ease: "power2.out" }, 3.55);
    tl.from("#scene1 .s1-folder", { x: -20, opacity: 0, duration: 0.35, ease: "power2.out" }, 3.7);
    tl.from("#scene1 .s1-subfolder", { x: -20, opacity: 0, duration: 0.35, ease: "power2.out" }, 3.8);
    tl.from("#scene1 .s1-note", { x: -20, opacity: 0, duration: 0.3, ease: "power2.out", stagger: 0.1 }, 3.95);
    tl.from("#scene1 .s1-breadcrumb", { y: -20, opacity: 0, duration: 0.45, ease: "power2.out" }, 3.7);
    tl.from("#scene1 .s1-overlay-line", { scaleX: 0, transformOrigin: "left center", duration: 0.5, ease: "power2.out" }, 4.0);
    tl.from("#scene1 .s1-overlay-text", { x: -30, opacity: 0, duration: 0.5, ease: "power2.out" }, 4.1);

    window.__timelines["main"] = tl;
  </script>
</body>
</html>
